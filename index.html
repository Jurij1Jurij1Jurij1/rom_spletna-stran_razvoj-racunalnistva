<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <title>Preusmeritev</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            text-align: center;
        }
        #countdown {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        #message {
            font-size: 1.2rem;
            color: #555;
        }
    </style>
</head>
<body>

    <div id="countdown">4</div>
    <div id="message">Preusmerjam na domačo stran ...</div>

    <script>
        let sekunde = 4;
        const element = document.getElementById("countdown");

        const interval = setInterval(() => {
            sekunde--;
            if (sekunde > 0) {
                element.textContent = sekunde;
            } else {
                clearInterval(interval);
                window.location.replace("./home/");
            }
        }, 1000);
    </script>

</body>
</html>
